  lab: "SIMPA (Signal, Image, Parole) Laboratory"
  email_user: "abdelkader.haddag"
  email_domain: "univ-usto.dz"
  department: "Department of Computer Science"
  faculty: "Faculty of Mathematics and Computer Science"
  street: "El Mnaouar, BP 1505"
  city: "Bir El Djir"
  postal: "31000"
  region: "Oran"
  country: "Algeria"
  country_code: "DZ"
phone: ""   # optional; leave empty to keep it off the public site

# Markdown: GitHub-style fences, Rouge syntax highlighting, and $$ ... $$ math (rendered by KaTeX when a page sets `math: true`)
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax
