# PROFESSIONAL COURSE CATALOG: control panel
#
# One line per course. Edit a line, commit, done.
#   available: true   -> listed in the catalog and on the Teaching page
#   available: false  -> hidden from every list and count (its page stays reachable by direct link,
#                        marked "not currently offered" and kept out of search engines)
#   status: Active    -> normal
#   status: Upcoming  -> listed with an "Upcoming" badge
#
# hours is the default duration shown on every course; give a course its own with  hours: 24  in its _courses file
# Codes are 4 letters + 3 digits. Course content (summary, outcomes, outline, prerequisites, icon) lives in _courses/<code>.md, e.g. _courses/pyth-101.md.
# Icons: a course about ONE specific language, framework/library or software gets its brand logo from
#   https://thesvg.org (set  icon: <slug>  in the course file). Every other course gets a plain UI icon
#   (set  symbol: <name>  using a file name from _includes/icons/ui/, e.g. brain, eye, bot, database; these are
#   thesvg.org's own UI icons: glass look, weight 1, round corners, plain ends).
#   The gallery card is tinted with the icon's dominant colour (see _data/icon_colors.yml).
# Categories (set in the course file): Programming | Office tools | Artificial Intelligence | Data & Analytics | Web Development | CS theory
# Levels: Foundational | Intermediate | Advanced | Specialized
# Offered in: in-person | online | self-paced. Optional per course, here, e.g.
#   PYTH 101:  { available: true, status: Active, modes: [online, self-paced] }
# Retired courses live in _archive/courses/ and are not built.
#
# New course: copy any file in _courses/, change code and text, then add its code below.
