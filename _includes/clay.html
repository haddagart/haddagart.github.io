<span class="clay{% if include.cls %} {{ include.cls }}{% endif %}" data-depth="{{ include.d }}" data-shape="{{ include.name }}" style="--x:{{ include.x }};--y:{{ include.y }};--s:{{ include.s }};--r:{{ include.r }}deg"><span class="clay__float"><img src="{{ '/assets/img/clay/' | relative_url }}{{ include.name }}.svg" alt="" width="200" height="200" loading="lazy" decoding="async"></span></span>
